<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Brogues</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans">

    <div class="flex flex-col md:flex-row justify-center items-center bg-red-900 text-white py-2 text-sm">
        <ul class="flex flex-wrap justify-center gap-4 px-4">
            <li>Free UK shipping on all orders</li>
        </ul>
        <ul class="flex flex-wrap justify-center gap-2 px-4 mt-2 md:mt-0">
            <li>See our 332 reviews on</li>
            <li class="font-bold underline cursor-pointer">Trustpilot</li>
        </ul>
    </div>


    <div class="flex justify-between items-center p-4 bg-white shadow-md">
        <h1 class="text-2xl md:text-3xl font-bold mx-4">LONDON BROGUES</h1>

    
        <button id="menu-toggle" class="md:hidden block text-xl">
            ☰
        </button>

        
        <ul id="menu" class="hidden md:flex flex-wrap gap-4 mx-4 text-lg">
            <li class="cursor-pointer hover:text-red-700">Home</li>
            <li class="cursor-pointer hover:text-red-700">Shoes</li>
            <li class="cursor-pointer hover:text-red-700">Boots</li>
            <li class="cursor-pointer hover:text-red-700">Weddings</li>
            <li class="cursor-pointer hover:text-red-700">Junior</li>
            <li class="cursor-pointer hover:text-red-700">Accessories</li>
            <li class="cursor-pointer hover:text-red-700">Style Blog</li>
            <li class="cursor-pointer hover:text-red-700">Contact</li>
            <li class="cursor-pointer hover:text-red-700">Profile</li>
            <li class="cursor-pointer hover:text-red-700">Cart</li>
        </ul>
    </div>


    <div class="">


        <img src="https://londonbrogues.co.uk/cdn/shop/products/SIDNEYTAN3Q.jpg" alt="Handcrafted Shoes" class="w-[80%] h-[80%]">


<h1 class="text-2xl text-black m-4">Sidney Oxford Tan</h1>
<h1 class="text-2xl text-black">£87.00</h1>
    </div>
    

    <script>
    
        document.getElementById('menu-toggle').addEventListener('click', function () {
            let menu = document.getElementById('menu');
            menu.classList.toggle('hidden');
        });
    </script>

</body>

</html>
