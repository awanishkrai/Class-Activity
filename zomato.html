<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Navigation Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class=""> 
        <img src="https://b.zmtcdn.com/web_assets/81f3ff974d82520780078ba1cfbd453a1583259680.png" alt="Zomato Logo"
            class="w-full h-[60vh]"> 
    </div>

    <div class="absolute top-[3%] text-white w-full shadow pr-40 pl-40 pb-6">
        <header class="flex justify-between">
            <div>
                <h1>Get the App</h1>
            </div>
            <nav class="flex space-x-8 text-xl">
                <a href="#" class="hover:underline" aria-label="Investor Relations">Investor Relations</a>
                <a href="#" class="hover:underline" aria-label="Add Restaurant">Add Restaurant</a>
                <a href="#" class="hover:underline" aria-label="Log In">Log In</a>
                <a href="#" class="hover:underline" aria-label="Sign Up">Sign Up</a>
            </nav>
        </header>

        <h1 class="text-6xl text-center font-bold pt-20">Zomato</h1>
        <h1 class="text-5xl text-center pt-8">Discover the best food & drinks in Ludhiana</h1>

        <div class="flex justify-center rounded-xl">
            <div class="flex bg-white w-[76%] rounded-xl m-10">
                <input type="text" class="w-[30%] p-4 rounded-xl" placeholder="Ludhiana">
                <h1 class="text-black p-4">|</h1>
                <input type="text" class="w-[70%] p-4 rounded-xl" placeholder="Search for restaurant">
            </div>
        </div>
    </div>

    
    <div class="flex justify-center p-4 space-x-20">
        
        <div class="w-1/3 border border-gray-200 rounded ">
            <img src="https://b.zmtcdn.com/webFrontend/e5b8785c257af2a7f354f1addaf37e4e1647364814.jpeg"
                alt="Order Online" class="w-full h-[25vh] object-cover">
            <div class="bg-white p-2 rounded">
                <h1>Order Online</h1>
                <h1>Stay home and order to your doorstep</h1>
            </div>
        </div>

        
        <div class="w-1/3 border border-gray-200 rounded ">
            <img src="https://b.zmtcdn.com/webFrontend/d026b357feb0d63c997549f6398da8cc1647364915.jpeg" alt="Dining"
                class="w-full h-[25vh] object-cover">
            <div class="bg-white p-2 rounded">
                <h1>Dining</h1>
                <h1>View the city's favourite dining venues</h1>
            </div>
        </div>
    </div>
</body>

</html>
