<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coca-Cola</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <!-- Navbar -->
    <div class="bg-white shadow-md">
        <div class="container mx-auto flex items-center justify-center gap-x-6 p-4">
            <img src="the-coca-cola-company-logo.svg" alt="Coca-Cola Logo" class="h-12">
            <nav>
                <ul class="flex space-x-6 text-lg font-semibold text-gray-700">
                    <li><a href="#" class="hover:text-red-600">Our Company</a></li>
                    <li><a href="#" class="hover:text-red-600">Brands</a></li>
                    <li><a href="#" class="hover:text-red-600">Sustainability</a></li>
                    <li><a href="#" class="hover:text-red-600">Social</a></li>
                    <li><a href="#" class="hover:text-red-600">Careers</a></li>
                    <li><a href="#" class="hover:text-red-600">Media Center</a></li>
                    <li><a href="#" class="hover:text-red-600">Investors</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Scrollable Full-Width Image Gallery -->
    <div class="mt-10 overflow-x-auto whitespace-nowrap scroll-smooth">
        <div class="flex flex-nowrap snap-x snap-mandatory">
            <img src="https://www.coca-colacompany.com/content/dam/company/xx/en/JC-image-16x9.png/width1960.png"
                class="w-screen h-[60vh]  snap-center">
            <img src="https://www.coca-colacompany.com/content/dam/company/us/en/TCCC_Innovation_Website_mastheads_01.png/width1960.png"
                class="w-screen h-[90vh] object-cover snap-center">
            <img src="https://www.coca-colacompany.com/content/dam/company/us/en/home/TCCC_mastheads_01.jpg/width1960.jpg"
                class="w-screen h-[90vh] object-cover snap-center">
            <img src="https://www.coca-colacompany.com/content/dam/company/us/en/home/TCCC_mastheads_refreshingly_local.jpg/width1960.jpg"
                class="w-screen h-[90vh] object-cover snap-center">
        </div>
    </div>
</body>

</html>
