<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-purple-800 to-purple-400 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-purple-800">Countdown Timer</h1>

        <input type="number" id="inputSeconds" placeholder="Enter seconds"
            class="w-full mb-4 px-4 py-2 border rounded-lg text-center text-lg outline-none focus:ring-2 focus:ring-blue-400" />

        

        <div class="flex justify-center" id="count">
            <button id="startBtn" onclick="startCountdown()"
                class="bg-blue-500 hover:bg-blue-600 text-white px-20 py-2 rounded-lg font-medium">
                Start Countdown
            </button>
        </div>
        <div id="display" class="text-4xl font-mono font-semibold text-blue-600 mb-6 border bg-purple-100 rounded-lg p-4 mt-4">
            00:00:00
        </div>
    </div>

    <script>
        let totalSeconds = 0;
        let countdown;

        function formatTime(seconds) {
            let hrs = Math.floor(seconds / 3600);
            let mins = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            if (hrs < 10) hrs = '0' + hrs;
            if (mins < 10) mins = '0' + mins;
            if (secs < 10) secs = '0' + secs;

            return hrs + ':' + mins + ':' + secs;
        }

        function updateDisplay() {
            const timeStr = formatTime(totalSeconds);
            
            document.getElementById('display').textContent = timeStr;
        }

        function startCountdown() {
            if (!countdown) {
                let input = document.getElementById('inputSeconds').value;
                totalSeconds = parseInt(input) || 0;
                updateDisplay();

                countdown = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(countdown);
                        countdown = null;
                       
                        document.getElementById('display').textContent = "Time's up!";
                    }
                }, 1000);
            }
        }

        updateDisplay();
    </script>
</body>

</html>
